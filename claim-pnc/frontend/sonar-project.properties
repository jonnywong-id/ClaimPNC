# SonarQube — frontend Claim PNC (React + TypeScript + Vite).
#
# projectKey dan alamat server ditentukan konfigurasi CI/CD GitLab kantor; berkas ini
# hanya memberi tahu scanner letak sumber, test, dan laporan coverage.
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Berkas test dianalisis sebagai test, bukan sebagai sumber.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Coverage — laporan lcov ditulis `npm run test:coverage` (lihat vite.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Dikecualikan dari HITUNGAN coverage saja (tetap dianalisis untuk issue):
#   src/main.tsx      entry point — hanya memasang <App /> ke #akar; dijalankan peramban.
#   src/**/*.d.ts     deklarasi tipe, tidak menghasilkan kode yang dijalankan.
sonar.coverage.exclusions=src/main.tsx,src/**/*.d.ts

sonar.typescript.tsconfigPaths=tsconfig.json

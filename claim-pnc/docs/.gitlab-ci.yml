# Pipeline docs Claim PNC (Markdown + SQL rujukan).
#
# Repo ini tidak berisi kode yang dikompilasi atau dites, jadi pipeline-nya hanya memeriksa
# hal yang memang dapat rusak di dokumen. Scanning SonarQube diurus konfigurasi CI/CD
# GitLab kantor.
stages:
  - verify

default:
  image: alpine:3.22
  interruptible: true

line-endings:
  stage: verify
  before_script:
    - apk add --no-cache git
  script:
    # .gitattributes menetapkan LF; berkas ber-CRLF tanda .gitattributes dilangkahi.
    - crlf="$(git ls-files --eol | grep 'i/crlf' || true)"
    - test -z "$crlf" || { echo "$crlf"; exit 1; }

secrets:
  stage: verify
  before_script:
    - apk add --no-cache git grep
  script:
    # Dokumen proyek tidak boleh memuat kredensial (aturan D-69): pola sandi/kunci yang
    # diberi nilai, atau blok kunci privat.
    - |
      hits="$(git ls-files -z | xargs -0 grep -nIE \
        -e 'IDENTIFIED BY[[:space:]]+"?[^"[:space:];]+' \
        -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
        -e '(password|passwd|secret|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{6,}["'"'"']' || true)"
      test -z "$hits" || { echo "$hits"; exit 1; }

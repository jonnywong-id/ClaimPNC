# golangci-lint v2 — backend Claim PNC, lapisan PEMBLOKIR.
#
# Hanya pemeriksaan yang menandakan BUG: temuan di sini membuat pipeline merah.
# Pemeriksaan maintainability dan security hotspot ada di .golangci-warnings.yml dan
# dijalankan sebagai peringatan.
#
#   govet         kesalahan yang dideteksi kompiler Go sendiri
#   staticcheck   hanya kelompok SA* (bug); ST*/QF*/S* adalah gaya → lapisan peringatan
#   ineffassign   nilai yang ditetapkan lalu tidak pernah dibaca
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
  settings:
    staticcheck:
      checks: ["SA*"]
  exclusions:
    paths:
      - spa/dist

formatters:
  enable:
    - gofmt

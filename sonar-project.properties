# SonarQube — backend Claim PNC (Go).
#
# projectKey dan alamat server ditentukan konfigurasi CI/CD GitLab kantor; berkas ini
# hanya memberi tahu scanner letak sumber, test, dan laporan coverage.
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Tidak dianalisis sama sekali:
#   **/*_test.go      dianalisis sebagai test lewat sonar.tests, bukan sebagai sumber.
#   spa/dist/**       hasil build frontend yang disematkan ke binary; bukan kode backend.
#   migrations/**     migrasi skema golang-migrate — DDL yang dijalankan DBA, bukan logika
#                     aplikasi, dan tidak boleh disunting setelah dijalankan.
#   cmd/_urut/**      skrip bantu pengembang untuk mencetak urutan tab; tidak ikut binary.
sonar.exclusions=**/*_test.go,spa/dist/**,migrations/**,cmd/_urut/**

# Dikecualikan dari HITUNGAN coverage saja (tetap dianalisis untuk issue):
#   cmd/**            entry point: perakitan seluruh modul (main.go, modules.go,
#                     registration.go, pladla.go, portalguard.go) dan mode diagnostik
#                     `-periksa` (check.go) yang hanya berarti terhadap Oracle sungguhan.
#                     Logika yang dirakitnya diuji di paket internal/** masing-masing.
sonar.coverage.exclusions=cmd/**

sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
